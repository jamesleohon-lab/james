# Fly.io config. Run `fly launch --copy-config --no-deploy` first and set
# `app` to the name it gives you.
app = "crypto-macro"
primary_region = "lhr"

[build]

[env]
  DATABASE_PATH = "/data/crypto_macro.db"

[mounts]
  source = "crypto_macro_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The scheduler must keep running to send alerts, so never stop the machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
